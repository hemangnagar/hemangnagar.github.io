<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root { --ledger: #1A2236; --ledger-ink: #E7EAF0; --ledger-muted: #8C97AD; --ledger-accent: #E8964A; --ok: #7FD1A3; --bad: #F08A8A; }
  html, body { margin: 0; background: #0B0E15; }
  body { width: 1280px; height: 800px; display: flex; align-items: center; justify-content: center; }
  .frame { width: 1200px; max-height: 760px; background: var(--ledger); border-radius: 10px; box-shadow: 0 24px 60px rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.08); overflow: hidden; display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); font: 500 12px/1 "IBM Plex Mono", ui-monospace, monospace; color: var(--ledger-muted); letter-spacing: 0.08em; text-transform: uppercase; }
  .bar i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: rgba(255,255,255,0.14); }
  .bar i:first-child { background: var(--ledger-accent); }
  .bar span { margin-left: 8px; }
  pre { margin: 0; padding: 22px 26px 26px; font: 400 var(--fs, 14.5px)/1.5 "IBM Plex Mono", ui-monospace, Consolas, monospace; color: var(--ledger-ink); white-space: pre-wrap; overflow-wrap: anywhere; overflow: hidden; tab-size: 4; }
  .cmd { color: var(--ledger-accent); font-weight: 500; }
  .cmd::before { content: "$ "; color: var(--ledger-muted); font-weight: 400; }
  .ok { color: var(--ok); font-weight: 500; }
  .bad { color: var(--bad); font-weight: 500; }
  .dim { color: var(--ledger-muted); }
  .hl { color: var(--ledger-accent); }
</style>
</head>
<body>
<div class="frame">
  <div class="bar"><i></i><i></i><i></i><span id="title"></span></div>
  <pre id="out"></pre>
</div>
<script>
  // Fills #out from window.__TERMINAL (set by capture.mjs). Lines starting with "$ " render as commands;
  // a few result words are tinted so the capture reads at a glance.
  const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const tint = s => s
    .replace(/\b(PASS|OK|verified|PROMOTED|approved|pass)\b/g, '<span class="ok">$1</span>')
    .replace(/\b(FAIL|BROKEN|QUARANTINED|WITHOUT A REVIEW|critical|fail|insufficient)\b/g, '<span class="bad">$1</span>')
    .replace(/\b(RESULT|OVERALL|RESULT\s+verified)\b/g, '<span class="hl">$1</span>');
  window.renderTerminal = ({ title, text, fontSize }) => {
    document.getElementById("title").textContent = title || "";
    if (fontSize) document.documentElement.style.setProperty("--fs", fontSize + "px");
    const html = text.split("\n").map(l => l.startsWith("$ ") ? `<span class="cmd">${esc(l.slice(2))}</span>` : l.startsWith("# ") ? `<span class="dim">${esc(l)}</span>` : tint(esc(l))).join("\n");
    document.getElementById("out").innerHTML = html;
  };
</script>
</body>
</html>
