<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Governed Data, in Four Dimensions</title>
<meta name="description" content="A self-contained 4D replay of real governed runs: records in space, the IEF chain giving them meaning, recipient authority splitting one source into three releases, and time — the lifecycle that decided it all.">
<style>
:root{
  --bg:#070b12;--panel:rgba(10,16,26,.82);--line:#1d2a3d;--ink:#e6edf7;--dim:#8a9bb4;
  --data:#59d3ff;--meaning:#ffb454;--authority:#7cf29a;--time:#c792ff;--danger:#ff6b81;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
#gl{position:fixed;inset:0;display:block;width:100vw;height:100vh}
#hud{position:fixed;inset:0;pointer-events:none;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:1fr 420px}
#hud > *{pointer-events:auto}
header{grid-column:1/3;display:flex;align-items:center;gap:18px;padding:12px 18px;background:linear-gradient(180deg,rgba(7,11,18,.95),rgba(7,11,18,0));}
header .brand{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--data)}
header h1{font-size:18px;margin:0;font-weight:600}
header .acts{display:flex;gap:6px;margin-left:12px}
.act-btn{background:transparent;border:1px solid var(--line);color:var(--dim);padding:6px 12px;border-radius:6px;font:inherit;font-size:12px;cursor:pointer}
.act-btn.on{color:var(--ink);border-color:var(--data);background:rgba(89,211,255,.08)}
.axes{margin-left:auto;display:flex;gap:8px}
.axis{font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--dim);transition:all .3s}
.axis b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle;background:currentColor;opacity:.5}
.axis.on{color:var(--ink);border-color:currentColor;box-shadow:0 0 18px -4px currentColor}
.axis.data.on{color:var(--data)}.axis.meaning.on{color:var(--meaning)}.axis.authority.on{color:var(--authority)}.axis.time.on{color:var(--time)}
#spacer{pointer-events:none}
aside{grid-row:2/4;grid-column:2;margin:0 14px 14px 0;display:flex;flex-direction:column;gap:10px;overflow:auto;padding-top:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;backdrop-filter:blur(8px)}
.card h3{margin:0 0 8px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.card .big{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px}
.kv dt{color:var(--dim)}.kv dd{margin:0;font-family:var(--mono);font-size:11.5px;word-break:break-all}
.mono{font-family:var(--mono)}
table.rel{width:100%;border-collapse:collapse;font-size:10.5px;font-family:var(--mono);table-layout:fixed}
table.rel th{text-align:left;color:var(--dim);font-weight:500;padding:3px 4px;border-bottom:1px solid var(--line);font-family:var(--sans)}
table.rel th:first-child{width:34%}
table.rel td{padding:3px 4px;vertical-align:top;border-bottom:1px solid rgba(29,42,61,.6);word-break:break-all}
td.masked{color:var(--meaning)}td.coarse{color:var(--data)}td.usper{color:var(--danger)}td.clear{color:var(--authority)}td.gone{color:var(--danger);font-style:italic}
.timeline{list-style:none;margin:0;padding:0;font-size:12px}
.timeline li{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:4px 0;border-left:2px solid var(--time);padding-left:10px;margin-left:4px}
.timeline li time{font-family:var(--mono);color:var(--time);font-size:11px;white-space:nowrap}
.timeline li.now{background:rgba(199,146,255,.08)}
footer{grid-column:1/3;padding:10px 18px 14px;background:linear-gradient(0deg,rgba(7,11,18,.96),rgba(7,11,18,0))}
.caption{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;margin-bottom:10px;max-width:1000px}
.caption .n{font-family:var(--mono);color:var(--data);font-size:20px;line-height:1.1;padding-top:3px}
.caption h2{margin:0 0 4px;font-size:18px;font-weight:600}
.caption p{margin:0;font-size:13px;color:#c5d0df;line-height:1.45;max-width:900px}
.caption .ev{margin-top:5px;font-size:11px;color:var(--dim);font-family:var(--mono)}
.transport{display:flex;align-items:center;gap:10px}
.transport button{background:rgba(89,211,255,.1);border:1px solid var(--data);color:var(--ink);padding:7px 14px;border-radius:6px;font:inherit;font-size:13px;cursor:pointer}
.transport button.ghost{background:transparent;border-color:var(--line);color:var(--dim)}
.transport input[type=range]{flex:1;accent-color:var(--data)}
.transport .t{font-family:var(--mono);font-size:11px;color:var(--dim);min-width:150px;text-align:right}
.transport select{background:#0d1522;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px;font:inherit;font-size:12px}
#count{position:fixed;left:18px;top:86px;pointer-events:none;font-variant-numeric:tabular-nums}
#count .v{font-size:44px;font-weight:600;line-height:1;letter-spacing:-.02em}
#count .l{font-size:12px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;margin-top:6px}
#count .sub{font-size:12px;color:#c5d0df;margin-top:8px;max-width:360px}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:10;font-size:13px;color:var(--dim)}
#loading.gone{display:none}
#nogl{position:fixed;left:18px;top:200px;max-width:560px;z-index:5;background:var(--panel);border:1px solid var(--danger);border-radius:10px;padding:16px 18px;font-size:13px;line-height:1.5;color:#c5d0df;backdrop-filter:blur(8px)}
#nogl h2{margin:0 0 8px;font-size:15px;color:var(--ink)}
#nogl p{margin:6px 0}
#nogl .mono{color:var(--danger);font-size:11px}
#perf{position:fixed;left:18px;bottom:120px;z-index:5;font-size:11px;color:var(--meaning);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px;max-width:520px}
.help{font-size:10.5px;color:#5f7089;margin-top:6px}
kbd{font-family:var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:10px}
@media (max-width:1100px){#hud{grid-template-columns:1fr 0}aside{display:none}}
@media (max-height:760px){#count .v{font-size:32px}.caption p{font-size:12px}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="loading">inflating the captured runs…</div>
<div id="count"><div class="v" id="count-v"></div><div class="l" id="count-l"></div><div class="sub" id="count-s"></div></div>
<div id="hud">
  <header>
    <div><div class="brand">Governed Data Platform · IEF</div><h1>Governed data, in four dimensions</h1></div>
    <div class="acts"><button class="act-btn on" data-act="1">Act 1 · One source, three releases</button><button class="act-btn" data-act="2">Act 2 · The person is the operator</button></div>
    <div class="axes">
      <span class="axis data" id="ax-data"><b></b>Data</span>
      <span class="axis meaning" id="ax-meaning"><b></b>Meaning</span>
      <span class="axis authority" id="ax-authority"><b></b>Authority</span>
      <span class="axis time" id="ax-time"><b></b>Time</span>
    </div>
  </header>
  <div id="spacer"></div>
  <aside id="rail"></aside>
  <footer>
    <div class="caption"><div class="n" id="cap-n">01</div><div><h2 id="cap-h"></h2><p id="cap-p"></p><div class="ev" id="cap-e"></div></div></div>
    <div class="transport">
      <button class="ghost" id="btn-reset" title="Reset (R)">Reset</button>
      <button class="ghost" id="btn-prev" title="Previous beat (←)">←</button>
      <button id="btn-play" title="Play / pause (space)">▶ Play</button>
      <button class="ghost" id="btn-next" title="Next beat (→)">→</button>
      <input type="range" id="scrub" min="0" max="1000" value="0">
      <span class="t" id="t-label"></span>
      <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
      <button class="ghost" id="btn-fs" title="Full screen (F)">Full screen</button>
    </div>
    <div class="help">Drag to orbit · wheel to zoom · <kbd>space</kbd> play · <kbd>←</kbd><kbd>→</kbd> beats · <kbd>1</kbd><kbd>2</kbd> acts · <kbd>R</kbd> reset · every number is a captured engine run — nothing here is drawn from a guess.</div>
  </footer>
</div>
